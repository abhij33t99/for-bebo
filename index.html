<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0a1747">
  <title>For Bebo 💙</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💙</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Fredoka:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <div id="sky" aria-hidden="true"></div>
  <div id="floaties" aria-hidden="true"></div>

  <nav id="dots" aria-hidden="true"></nav>
  <button id="music" type="button" aria-label="Music on or off" hidden>🎵</button>

  <main>
    <section class="screen" data-screen="welcome">
      <div class="stitch peek" data-mood="peek"></div>
      <h1 data-text="welcome.title"></h1>
      <p data-text="welcome.subtitle"></p>
      <button type="button" class="btn pulse" data-next data-text="welcome.button"></button>
    </section>

    <section class="screen" data-screen="sorry">
      <div class="stitch" data-mood="sad"></div>
      <h1 data-text="sorry.title"></h1>
      <p class="glass" data-text="sorry.text"></p>
      <button type="button" class="btn" data-next>Aage padho 💌</button>
    </section>

    <section class="screen" data-screen="letter">
      <h2 data-text="letterTitle"></h2>
      <button type="button" id="envelope" aria-label="Open the letter">
        <span class="flap"></span>
        <span class="seal">💙</span>
        <span class="hint">Tap to open</span>
      </button>
      <article id="paper" hidden><div id="typed" aria-hidden="true"></div><div id="fulltext" class="sr-only"></div></article>
      <p id="skiphint" class="small" hidden>Poora padhne ke liye letter par tap karo</p>
      <button type="button" class="btn" id="letterNext" data-next hidden>Aur ek cheez 👉</button>
    </section>

    <section class="screen" data-screen="reasons">
      <h2>Why I love you 💕</h2>
      <p class="small">Har card pe tap karo</p>
      <div id="cards"></div>
      <button type="button" class="btn" data-next>Next 💙</button>
    </section>

    <section class="screen" data-screen="memories">
      <h2>Humari yaadein 📸</h2>
      <div id="gallery"></div>
      <button type="button" class="btn" data-next>Next ✨</button>
    </section>

    <section class="screen" data-screen="promises">
      <h2>Mere promises 🤞</h2>
      <ul id="promises"></ul>
      <button type="button" class="btn" data-next>Ek last sawaal 🥺</button>
    </section>

    <section class="screen" data-screen="ask">
      <div class="stitch" data-mood="plead"></div>
      <h1 data-text="ask.title"></h1>
      <p class="small" data-text="ask.subtitle"></p>
      <p id="teaser" aria-live="polite">&nbsp;</p>
      <div id="choices">
        <button type="button" class="btn yes" id="yes">Yes 💙</button>
        <span id="noSlot"><button type="button" class="btn no" id="no" tabindex="-1">No 🙄</button></span>
      </div>
    </section>

    <section class="screen" data-screen="celebrate">
      <div class="stitch dance" data-mood="happy"></div>
      <h1 data-text="celebrate.title"></h1>
      <p class="glass" data-text="celebrate.text"></p>
      <p id="status" class="small" aria-live="polite"></p>
      <a id="share" class="btn" target="_blank" rel="noopener" hidden>Mujhe batao 💌</a>
    </section>
  </main>

  <div id="lightbox" hidden><figure><img alt=""><figcaption></figcaption></figure></div>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <audio id="song" loop preload="auto"></audio>

  <script src="config.js"></script>
  <script src="effects.js"></script>
  <script src="script.js"></script>
</body>
</html>
